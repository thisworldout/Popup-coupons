<!DOCTYPE html>
<html lang="ru" class="coupon-widget-doc">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Промокод</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap"
      rel="stylesheet"
    />
    <style>
/* Letterbox — макет секции Figma 277:456 (рейка 277:471, развёрнуто 277:457, body 277:458) */
#coupon-root[hidden] {
  display: none !important;
}

.coupon-root,
.coupon-root *,
.coupon-root *::before,
.coupon-root *::after {
  box-sizing: border-box;
}

html.coupon-widget-doc {
  /* Шрифты для страницы-демо (виджет задаёт те же токены у себя) */
  --coupon-font: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue",
    Arial, sans-serif;
  --coupon-code-font: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, monospace;
  /* Как у типичного логотипа Tilda (t135 ~20px); шире — hostInlinePx в COUPON_CONFIG */
  --coupon-host-inline: 20px;
  --coupon-host-bottom: 50px;
  overflow-x: hidden;
  overflow-y: visible;
}

.coupon-root {
  /* На хосте: fixed + поля от краёв; слева по умолчанию как t135 (~20px), не 50 — иначе расходится с шапкой */
  --coupon-host-inline: 20px;
  --coupon-host-bottom: 50px;
  --lb-black: #000000;
  --lb-white: #ffffff;
  --coupon-accent: #2958ff;
  /* Единая «стеклянная» база: свёрнуто и развёрнуто одной гаммы */
  --coupon-surface: #eef1f7;
  --coupon-surface-border: rgba(15, 23, 42, 0.14);
  /* Figma Letterbox 277:457 / 289:505 */
  --coupon-figma-border: #eeeeee;
  --coupon-figma-border-collapsed: #e6e6e6;
  --coupon-footnote-muted: rgba(123, 123, 123, 0.76);
  --lb-code-bg: rgba(255, 217, 0, 0.3);
  --lb-card-border: rgba(255, 255, 255, 0.72);
  --coupon-font: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue",
    Arial, sans-serif;
  --coupon-code-font: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, monospace;
  --coupon-tap-min: 44px;
  /* Figma 277:471 «Шапка»: ~112×356 */
  --coupon-rail-width: 112px;
  --coupon-rail-min-height: 380px;
  --coupon-rail-anchor-half: calc(var(--coupon-rail-min-height) / 2);
  --coupon-rail-label-min-height: 200px;
  --coupon-rail-label-min-width: 100%;
  --coupon-rail-pad: 24px 28px 24px;
  /* ≥ рейка + разделитель + колонка контента (~112+2+362); 328px обрезал текст/Cta */
  --panel-expanded: 520px;
  /* Figma Шапка rounded-[24px] */
  --coupon-radius: 24px;
  --ease-spring: cubic-bezier(0.22, 1, 0.36, 1);
  --ease-out: cubic-bezier(0.4, 0, 0.2, 1);
  --ease-in-out: cubic-bezier(0.42, 0, 0.58, 1);
  --dur-open: 0.46s;
  --dur-close: 0.42s;
  /* Общее уменьшение блока (визуальный scale, origin слева по центру) */
  --coupon-ui-scale: 0.86;
  /* Запас от верха/низа и справа экрана, чтобы блок не прилипал и не «прыгал» у краёв */
  --coupon-vp-x-gutter: 10px;
  --coupon-vp-y-gutter: 16px;
  --coupon-max-bleed: min(
    var(--panel-expanded),
    calc(
      100vw - max(var(--coupon-host-inline), env(safe-area-inset-left, 0px)) -
        max(12px, env(safe-area-inset-right, 0px)) - var(--coupon-vp-x-gutter)
    )
  );
  pointer-events: auto;
  width: fit-content;
  max-width: var(--coupon-max-bleed);
  margin: 0 auto;
  display: flex;
  justify-content: center;
  font-family: var(--coupon-font);
  color: var(--lb-black);
}

@media (max-width: 768px) {
  html.coupon-widget-doc,
  .coupon-root {
    /* Совпадает с отступом логотипа в шапке Tilda (t135: часто top/left 20px у img.t135__img) */
    --coupon-host-inline: 20px;
    --coupon-host-bottom: 24px;
    /* На планшетах/телефонах не даём scale 0.86 «наслаиваться» на уменьшенные токены 480px */
    --coupon-ui-scale: 0.92;
    --coupon-vp-x-gutter: 18px;
    --coupon-vp-y-gutter: 36px;
    /* Без потолка 520px: развёрнутая панель может занять почти всю ширину экрана */
    --panel-expanded: calc(
      100vw - max(var(--coupon-host-inline), env(safe-area-inset-left, 0px)) -
        max(12px, env(safe-area-inset-right, 0px)) - var(--coupon-vp-x-gutter)
    );
  }

  /*
   * Стабильная ширина корня: раньше width был fit-content в свёрнутом виде и --coupon-max-bleed
   * только при data-expanded=true → скачок вёрстки страницы / полосы прокрутки. Держим ширину
   * постоянной; пустая область справа не перехватывает клики (pointer-events).
   */
  .coupon-root {
    width: var(--coupon-max-bleed);
    max-width: var(--coupon-max-bleed);
    pointer-events: none;
    /* Иначе узкая свёрнутая панель центрируется, а width:100% развёрнутая — к левому краю: рейка «прыгает» */
    justify-content: flex-start;
  }

  .coupon-root .coupon-panel {
    pointer-events: auto;
  }

  .coupon-root.coupon-root--host {
    max-height: min(
      calc(100dvh - 2 * var(--coupon-host-inline) - var(--coupon-vp-y-gutter)),
      calc(100vh - 2 * var(--coupon-host-inline) - var(--coupon-vp-y-gutter)),
      calc(
        100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px) -
          var(--coupon-vp-y-gutter)
      ),
      calc(
        100vh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px) -
          var(--coupon-vp-y-gutter)
      )
    );
  }

  .coupon-panel {
    max-height: min(
      calc(100dvh - 2 * var(--coupon-host-inline) - var(--coupon-vp-y-gutter)),
      calc(100vh - 2 * var(--coupon-host-inline) - var(--coupon-vp-y-gutter)),
      calc(
        100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px) -
          var(--coupon-vp-y-gutter)
      ),
      calc(
        100vh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px) -
          var(--coupon-vp-y-gutter)
      )
    );
  }

  .coupon-panel[data-expanded="true"] .coupon-expand {
    flex: 1 1 0;
    min-width: 0;
    max-height: min(
      calc(100dvh - 2 * var(--coupon-host-inline) - var(--coupon-vp-y-gutter)),
      calc(100vh - 2 * var(--coupon-host-inline) - var(--coupon-vp-y-gutter)),
      calc(
        100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px) -
          var(--coupon-vp-y-gutter)
      ),
      calc(
        100vh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px) -
          var(--coupon-vp-y-gutter)
      )
    );
  }

  .coupon-body {
    padding: 26px 24px 22px;
  }

  .coupon-body-main {
    gap: 12px;
  }

  .coupon-close-full {
    width: 56px;
    height: 56px;
    min-width: 56px;
    min-height: 56px;
  }

  .coupon-close-full svg {
    width: 20px;
    height: 20px;
  }

  .coupon-code {
    font-size: 28px;
    letter-spacing: 0.09em;
    min-height: 80px;
    padding: 20px 14px;
  }

  .coupon-footnote {
    font-size: 12px;
    letter-spacing: -0.24px;
    line-height: 1.4;
  }

  .coupon-description {
    font-size: 18px;
    letter-spacing: -0.54px;
  }

  .coupon-cta {
    height: 56px;
    min-height: 56px;
    font-size: 21px;
    letter-spacing: -0.42px;
    padding: 12px 26px;
  }

  .coupon-panel[data-expanded="true"] {
    width: 100%;
    max-width: 100%;
    /* Рейка и колонка контента — одна высота (единая карточка) */
    align-items: stretch;
  }

  .coupon-panel[data-expanded="true"] .coupon-main {
    max-width: none;
    flex: 1 1 0;
    min-width: 0;
  }
}

@media (max-width: 380px) {
  html.coupon-widget-doc,
  .coupon-root {
    --coupon-host-bottom: max(16px, env(safe-area-inset-bottom, 0px));
  }
}

html.coupon-widget-doc,
body.coupon-widget-doc {
  margin: 0;
  min-height: 100%;
  min-height: 100dvh;
  font-family: var(--coupon-font);
  background: transparent;
  color: #000000;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}

body.coupon-widget-doc {
  display: flex;
  align-items: center;
  justify-content: flex-start;
  padding: max(12px, env(safe-area-inset-top, 0px))
    max(var(--coupon-host-inline), env(safe-area-inset-right, 0px))
    max(var(--coupon-host-bottom), env(safe-area-inset-bottom, 0px))
    max(var(--coupon-host-inline), env(safe-area-inset-left, 0px));
  pointer-events: none;
  overflow: visible;
}

.coupon-root.coupon-root--host {
  position: fixed;
  left: max(var(--coupon-host-inline), env(safe-area-inset-left, 0px));
  right: auto;
  /* Центр по высоте всего блока (рейка+панель), а не только рейки — иначе при раскрытии
     контент «уезжает» вниз/вправо, а верх визуально прибит */
  top: 50%;
  bottom: auto;
  z-index: 9999;
  margin: 0;
  width: fit-content;
  max-width: var(--coupon-max-bleed);
  max-height: min(
    calc(100dvh - 2 * var(--coupon-host-inline) - var(--coupon-vp-y-gutter)),
    calc(100vh - 2 * var(--coupon-host-inline) - var(--coupon-vp-y-gutter))
  );
  /* Тень на корне (drop-shadow), без overflow:hidden — не обрезается */
  overflow: visible;
  transform: translateY(-50%);
  filter: drop-shadow(0 4px 18px rgba(15, 23, 42, 0.12))
    drop-shadow(0 2px 6px rgba(15, 23, 42, 0.07));
  transition: filter 0.35s ease;
}

/* Сильнее базовой: развёрнуто, hover/focus свёрнуто (после клика :hover пропадает — без этого тень «съедается») */
.coupon-root.coupon-root--host:has(.coupon-panel[data-expanded="true"]),
.coupon-root.coupon-root--host:has(.coupon-panel[data-expanded="false"]:hover),
.coupon-root.coupon-root--host:has(.coupon-panel[data-expanded="false"]:focus-within) {
  filter: drop-shadow(0 6px 22px rgba(15, 23, 42, 0.14))
    drop-shadow(0 2px 8px rgba(15, 23, 42, 0.08));
}

.coupon-panel {
  position: relative;
  display: flex;
  flex-direction: row;
  align-items: stretch;
  width: max-content;
  max-width: var(--coupon-max-bleed);
  max-height: min(
    calc(100dvh - 2 * var(--coupon-host-inline) - var(--coupon-vp-y-gutter)),
    calc(100vh - 2 * var(--coupon-host-inline) - var(--coupon-vp-y-gutter))
  );
  border-radius: var(--coupon-radius);
  overflow: hidden;
  border: 2px solid transparent;
  transform: scale(var(--coupon-ui-scale));
  transform-origin: left center;
  transition:
    background var(--dur-open) var(--ease-spring),
    border-color 0.35s ease,
    opacity 0.4s var(--ease-in-out);
}

.coupon-panel[data-expanded="true"] {
  /* Развёрнуто: непрозрачная заливка (без glass / blur) */
  background: var(--lb-white);
  border-color: var(--coupon-figma-border);
  overflow: hidden;
  opacity: 1;
}

.coupon-panel[data-expanded="false"] {
  /* 20% прозрачность в покое; :hover / :focus-within / развёрнуто — непрозрачно */
  opacity: 0.8;
  background: var(--lb-white);
  border-color: var(--coupon-figma-border-collapsed);
  /* Подпись с rotate выступает по горизонтали — иначе обрезка */
  overflow: visible;
  /* Свёрнутая панель = только рейка: жёсткий минимум, без схлопывания flex/grid */
  min-width: 112px;
  min-width: var(--coupon-rail-width);
  min-height: 380px;
  min-height: var(--coupon-rail-min-height);
}

.coupon-panel[data-expanded="false"]:hover,
.coupon-panel[data-expanded="false"]:focus-within {
  opacity: 1;
}

/* Вертикальная рейка (Figma 277:471 / 289:505; в строке: Скидка + 10%; rotate(90deg)) */
.coupon-rail.coupon-header,
.coupon-rail {
  display: flex;
  flex-direction: column;
  align-items: stretch;
  justify-content: stretch;
  width: 112px;
  width: var(--coupon-rail-width);
  min-width: 112px;
  min-width: var(--coupon-rail-width);
  flex-shrink: 0;
  padding: 0;
  margin: 0;
  cursor: pointer;
  user-select: none;
  border: none;
  background: transparent;
  text-align: center;
  font-family: var(--coupon-font);
  color: var(--lb-black);
  -webkit-appearance: none;
  appearance: none;
  box-sizing: border-box;
  align-self: stretch;
  min-height: 380px;
  min-height: var(--coupon-rail-min-height);
  height: auto;
  overflow: visible;
}

/* Выше специфичность хостовых reset’ов вроде button { min-height: 0 } */
#coupon-header.coupon-rail.coupon-header {
  min-width: 112px;
  min-width: var(--coupon-rail-width);
  min-height: 380px;
  min-height: var(--coupon-rail-min-height);
}

/*
 * Ниже базового .coupon-rail — иначе каскад затирает.
 * Свёрнуто: узкая рейка фиксированной высоты. Развёрнуто: та же ширина рейки, высота = высоте панели.
 */
@media (max-width: 768px) {
  .coupon-panel[data-expanded="false"] .coupon-rail.coupon-header,
  .coupon-panel[data-expanded="false"] .coupon-rail {
    align-self: flex-start;
    flex: 0 0 var(--coupon-rail-width);
    width: var(--coupon-rail-width);
    max-width: var(--coupon-rail-width);
    box-sizing: border-box;
  }

  .coupon-panel[data-expanded="true"] .coupon-rail.coupon-header,
  .coupon-panel[data-expanded="true"] .coupon-rail {
    align-self: stretch;
    flex: 0 0 var(--coupon-rail-width);
    width: var(--coupon-rail-width);
    max-width: var(--coupon-rail-width);
    min-height: var(--coupon-rail-min-height);
    height: auto;
    max-height: none;
    box-sizing: border-box;
  }

  .coupon-panel[data-expanded="false"] .coupon-expand {
    flex: 0 0 0;
    min-width: 0;
  }
}

.coupon-rail:focus-visible,
.coupon-header:focus-visible {
  outline: 2px solid var(--coupon-accent);
  outline-offset: 2px;
}

/* Обертка: центр внутри рейки; при align-items:stretch у панели рейка тянется по высоте развёрнутого блока */
.coupon-rail-stack {
  display: flex;
  flex-direction: column;
  flex: 1 1 auto;
  align-self: stretch;
  min-width: 112px;
  min-width: var(--coupon-rail-width);
  min-height: 380px;
  min-height: var(--coupon-rail-min-height);
  width: 100%;
  align-items: center;
  justify-content: flex-start;
  padding: 0;
  margin: 0;
  overflow: visible;
}

/* Подпись + шеврон: только строка крутится — не режем узкой колонкой как весь .coupon-rail-rot */
.coupon-rail-rot {
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  align-items: center;
  flex: 1 1 auto;
  align-self: stretch;
  min-width: var(--coupon-rail-width);
  min-height: min-content;
  width: 100%;
  padding: var(--coupon-rail-pad);
  box-sizing: border-box;
  gap: 24px;
}

.coupon-rail-label-wrap {
  flex: 1 1 auto;
  display: flex;
  align-items: center;
  justify-content: center;
  min-width: var(--coupon-rail-label-min-width);
  min-height: var(--coupon-rail-label-min-height);
  width: 100%;
  overflow: visible;
}

.coupon-rail-label-row {
  display: inline-flex;
  flex-direction: row;
  align-items: baseline;
  justify-content: center;
  gap: 4px;
  white-space: nowrap;
  /* Текст вдоль рейки: поворот +90° (не зеркалирование) */
  transform: rotate(90deg);
  transform-origin: center center;
  width: max-content;
  min-width: max-content;
  min-height: 1.25em;
}

/* Figma 283:485 — 34px; порядок: Скидка, затем процент */
.coupon-kicker {
  font-size: 34px;
  font-weight: 700;
  line-height: 1;
  letter-spacing: -1.02px;
  color: var(--coupon-accent);
  flex-shrink: 0;
  text-transform: uppercase;
  min-height: 1em;
  min-width: 0.5em;
}

.coupon-title {
  font-size: 34px;
  font-weight: 600;
  line-height: 1;
  letter-spacing: -1.02px;
  color: var(--lb-black);
  text-transform: uppercase;
  white-space: nowrap;
  min-height: 1em;
  min-width: 2.5ch;
}

.coupon-rail .coupon-kicker:empty {
  display: none;
}

.coupon-chevron {
  flex-shrink: 0;
  /* Figma 277:475 — 64×64 */
  width: 64px;
  height: 64px;
  min-width: 64px;
  min-height: 64px;
  border-radius: 50%;
  background: rgba(0, 0, 0, 0.06);
  color: var(--lb-black);
  display: grid;
  place-items: center;
}

.coupon-chevron svg {
  display: block;
  width: 26px;
  height: 26px;
  margin-top: 0;
  transform-origin: center;
  transition: transform var(--dur-open) var(--ease-spring);
}

/* Свёрнуто: шеврон вправо (раскрыть); развёрнуто: влево (свернуть) */
.coupon-panel[data-expanded="false"] .coupon-chevron svg {
  transform: rotate(90deg);
}

.coupon-panel[data-expanded="true"] .coupon-chevron svg {
  transform: rotate(-90deg);
}

.coupon-expand {
  display: grid;
  grid-template-columns: 0fr;
  min-width: 0;
  min-height: 0;
  align-self: stretch;
  transition: grid-template-columns var(--dur-open) var(--ease-spring);
}

.coupon-panel[data-expanded="false"] .coupon-expand {
  grid-template-columns: 0fr;
  pointer-events: none;
  transition: grid-template-columns var(--dur-close) var(--ease-out);
  /* Иначе скрытый блок с контентом задаёт высоту строки ~300px — рейка растягивается */
  max-height: 0;
  overflow: hidden;
}

.coupon-panel[data-expanded="true"] .coupon-expand {
  grid-template-columns: 1fr;
  max-height: min(
    calc(100dvh - 2 * var(--coupon-host-inline) - var(--coupon-vp-y-gutter)),
    calc(100vh - 2 * var(--coupon-host-inline) - var(--coupon-vp-y-gutter))
  );
}

.coupon-expand-inner {
  overflow: hidden;
  min-width: 0;
  min-height: 0;
  display: flex;
  flex-direction: row;
  align-items: stretch;
  opacity: 1;
  transform: none;
  transition: opacity var(--dur-close) var(--ease-in-out);
}

.coupon-panel[data-expanded="false"] .coupon-expand-inner {
  opacity: 0;
  transform: none;
}

.coupon-panel[data-expanded="true"] .coupon-expand-inner {
  opacity: 1;
  transition: opacity 0s linear;
  overflow-x: hidden;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
}

.coupon-divider-vertical {
  flex-shrink: 0;
  width: 2px;
  align-self: stretch;
  background: var(--coupon-figma-border);
  margin: 0;
  padding: 0;
  border: none;
}

.coupon-main {
  flex: 1;
  min-width: 0;
  min-height: 0;
  /* Figma 277:458 Body внутренняя колонка 306 + по 28px с боков */
  max-width: 362px;
  display: flex;
  flex-direction: column;
}

.coupon-panel[data-expanded="true"] .coupon-main {
  min-width: min(
    306px,
    calc(

  var root = document.getElementById("coupon-root");
  if (!root) {
    if (typeof console !== "undefined" && console.warn) {
      console.warn("[coupon-widget] Не найден элемент #coupon-root.");
    }
    return;
  }

  /* Без class coupon-root токены из CSS не применяются — var(...) ломается, рейка схлопывается (~76px). */
  if (!root.classList.contains("coupon-root")) {
    root.classList.add("coupon-root");
  }

  var cfg = window.COUPON_CONFIG || {};
  var storageKey = cfg.storageKey || "coupon-widget-state";

  /* Пока не готов — не показываем (убирает мелькание в шапке до hoist/fixed). */
  root.setAttribute("data-ready", "false");

  /* Демо только как в html/widget.html: class на body. Если class только на html (часто при копировании) — на сайте всё равно включаем host+fixed+hoist. */
  var isCouponDemoPage =
    document.body &&
    document.body.classList.contains("coupon-widget-doc");
  if (!isCouponDemoPage) {
    root.classList.add("coupon-root--host");
    if (cfg.hoistToBody !== false && document.body) {
      document.body.appendChild(root);
    }
  }

  root.removeAttribute("hidden");

  var code = String(cfg.couponCode || "CODE");

  var panel = document.getElementById("coupon-panel");
  var collapseEl = document.getElementById("coupon-collapse");
  var header = document.getElementById("coupon-header");
  var kickerEl = document.getElementById("coupon-kicker");
  var titleEl = document.getElementById("coupon-title");
  var descEl = document.getElementById("coupon-description");
  var codeEl = document.getElementById("coupon-code");
  var hintEl = document.getElementById("coupon-copy-hint");
  var ctaEl = document.getElementById("coupon-cta");
  var footEl = document.getElementById("coupon-footnote");
  var closeFullEl = document.getElementById("coupon-close-full");

  var demoTimers = [];
  function clearDemo() {
    for (var i = 0; i < demoTimers.length; i++) {
      clearTimeout(demoTimers[i]);
    }
    demoTimers = [];
    clearHoverReveal();
  }

  /** Откуда открыто: hover = закрыть при mouseleave; click/storage/demo = нет */
  var openSource = "closed";

  function supportsHoverFine() {
    try {
      return window.matchMedia("(hover: hover) and (pointer: fine)").matches;
    } catch (_) {
      return false;
    }
  }

  function persistExpanded(isOpen) {
    if (!cfg.rememberState) return;
    try {
      localStorage.setItem(storageKey, isOpen ? "1" : "0");
    } catch (_) {}
  }

  if (cfg.accent) {
    root.style.setProperty("--coupon-accent", cfg.accent);
  }
  if (typeof cfg.hostBottomPx === "number") {
    root.style.setProperty("--coupon-host-bottom", cfg.hostBottomPx + "px");
  }

  /* hostInlinePx задаёт инлайн и перебивает CSS; на ≤768px снимаем его, если нет hostInlinePxMobile,
     чтобы работали значения из widget.css (по умолчанию 20px — как t135). */
  function applyHostInlineFromConfig() {
    var desktop =
      typeof cfg.hostInlinePx === "number" ? cfg.hostInlinePx : null;
    var mobile =
      typeof cfg.hostInlinePxMobile === "number"
        ? cfg.hostInlinePxMobile
        : null;

    function sync() {
      var narrow = window.matchMedia("(max-width: 768px)").matches;
      if (narrow) {
        if (mobile !== null) {
          root.style.setProperty("--coupon-host-inline", mobile + "px");
        } else if (desktop !== null) {
          root.style.removeProperty("--coupon-host-inline");
        }
      } else {
        if (desktop !== null) {
          root.style.setProperty("--coupon-host-inline", desktop + "px");
        } else {
          root.style.removeProperty("--coupon-host-inline");
        }
      }
    }

    sync();
    try {
      var mql = window.matchMedia("(max-width: 768px)");
      if (mql.addEventListener) {
        mql.addEventListener("change", sync);
      } else if (mql.addListener) {
        mql.addListener(sync);
      }
    } catch (_) {}
    window.addEventListener("orientationchange", sync);
    window.addEventListener("resize", sync);
  }

  applyHostInlineFromConfig();

  kickerEl.textContent = cfg.kicker || "10%";
  titleEl.textContent = cfg.title || "Скидка";

  var foot = (cfg.footnote || "").trim();
  if (foot && footEl) {
    footEl.textContent = foot;
    footEl.removeAttribute("hidden");
  } else if (footEl) {
    footEl.textContent = "";
    footEl.setAttribute("hidden", "");
  }

  var desc = (cfg.description || "").trim();
  if (desc) {
    descEl.textContent = desc;
    descEl.removeAttribute("hidden");
  } else {
    descEl.textContent = "";
    descEl.setAttribute("hidden", "");
  }

  codeEl.textContent = code;
  codeEl.setAttribute(
    "aria-label",
    "Промокод " + code + ", нажмите чтобы скопировать"
  );

  var copyLabel = (cfg.copyLabel || "").trim();
  var copiedLabel = cfg.copiedLabel || "Скопировано";
  if (copyLabel) {
    hintEl.textContent = copyLabel;
    hintEl.removeAttribute("hidden");
  } else {
    hintEl.textContent = "";
    hintEl.setAttribute("hidden", "");
  }

  function isNarrowMobile() {
    try {
      return window.matchMedia("(max-width: 480px)").matches;
    } catch (_) {
      return false;
    }
  }

  function syncCtaVisibility() {
    if (!ctaEl) return;
    var ctaTextCfg = cfg.ctaText;
    ctaEl.hidden = !ctaTextCfg;
  }

  function copyCode(collapseAfterCopy) {
    function hintFinish() {
      if (!hintVisible()) return;
      hintEl.textContent = copiedLabel;
      hintEl.setAttribute("data-copied", "true");
      setTimeout(function () {
        hintEl.textContent = copyLabel;
        hintEl.removeAttribute("data-copied");
      }, 2200);
    }

    function hintVisible() {
      return copyLabel && !hintEl.hasAttribute("hidden");
    }

    function ctaFinish() {
      if (!ctaEl || ctaEl.hidden) return;
      if (!(cfg.ctaText && !cfg.ctaUrl)) return;
      var prev = ctaEl.textContent;
      ctaEl.textContent = copiedLabel;
      ctaEl.disabled = true;
      setTimeout(function () {
        ctaEl.textContent = prev;
        ctaEl.disabled = false;
      }, 2200);
    }

    function finish() {
      hintFinish();
      ctaFinish();
      if (collapseAfterCopy) {
        clearDemo();
        applyExpanded(false);
      }
    }

    function fallbackCopy() {
      var ta = document.createElement("textarea");
      ta.value = code;
      ta.setAttribute("readonly", "");
      ta.style.position = "fixed";
      ta.style.left = "-9999px";
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand("copy");
        finish();
      } catch (_) {}
      document.body.removeChild(ta);
    }

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(code).then(finish).catch(fallbackCopy);
    } else {
      fallbackCopy();
    }
  }

  var ctaText = cfg.ctaText;
  var ctaUrl = cfg.ctaUrl;
  if (ctaText && ctaUrl) {
    if (ctaEl) {
      ctaEl.textContent = ctaText;
      ctaEl.type = "button";
      ctaEl.setAttribute("aria-label", ctaText + " — открыть ссылку");
      ctaEl.addEventListener("click", function () {
        commitOpen();
        window.open(ctaUrl, "_blank", "noopener,noreferrer");
      });
    }
  } else if (ctaText) {
    if (ctaEl) {
      ctaEl.textContent = ctaText;
      ctaEl.type = "button";
      ctaEl.setAttribute("aria-label", "Скопировать промокод");
      ctaEl.addEventListener("click", function () {
        commitOpen();
        copyCode(true);
      });
    }
  }
  syncCtaVisibility();

  function getStoredExpanded() {
    if (!cfg.rememberState) return null;
    try {
      var v = localStorage.getItem(storageKey);
      if (v === "1") return true;
      if (v === "0") return false;
    } catch (_) {}
    return null;
  }

  /** Сколько ещё ждать перед показом после закрытия крестиком (0 = пауза выключена). */
  function dismissCooldownRemainingMs() {
    var ms =
      typeof cfg.dismissCooldownMs === "number"
        ? cfg.dismissCooldownMs
        : 10 * 60 * 1000;
    if (ms <= 0) return 0;
    try {
      var raw = localStorage.getItem(storageKey + ":dismissed-at");
      if (!raw) return 0;
      var at = parseInt(raw, 10);
      if (isNaN(at)) return 0;
      var left = ms - (Date.now() - at);
      return left > 0 ? left : 0;
    } catch (_) {
      return 0;
    }
  }

  function persistDismissTimestamp() {
    try {
      localStorage.setItem(storageKey + ":dismissed-at", String(Date.now()));
    } catch (_) {}
  }

  var expanded = false;
  var pointerInPanel = false;
  var hoverRevealTimer = null;
  var hoverRevealFallbackTimer = null;
  var collapseShrinkHandler = null;

  /**
   * Рельс (узкая → полная ширина перед открытием) отключён: одна ширина,
   * меньше визуальных фаз и мерцания при hover/embed.
   */
  function useRailBehavior() {
    return false;
  }

  function setRootWidthMode(mode) {
    if (!useRailBehavior()) {
      root.removeAttribute("data-panel-width");
      return;
    }
    root.setAttribute("data-panel-width", mode === "mini" ? "mini" : "full");
  }

  function clearHoverReveal() {
    if (hoverRevealTimer) {
      clearTimeout(hoverRevealTimer);
      hoverRevealTimer = null;
    }
    if (hoverRevealFallbackTimer) {
      clearTimeout(hoverRevealFallbackTimer);
      hoverRevealFallbackTimer = null;
    }
    root.removeEventListener("transitionend", onRailWidthTransitionEnd);
  }

  function onRailWidthTransitionEnd(e) {
    if (e.target !== root || e.propertyName !== "width") return;
    root.removeEventListener("transitionend", onRailWidthTransitionEnd);
    clearTimeout(hoverRevealFallbackTimer);
    hoverRevealFallbackTimer = null;
    tryOpenHoverBody();
  }

  function tryOpenHoverBody() {
    if (!pointerInPanel || expanded) return;
    applyExpanded(true, "hover");
  }

  function cancelCollapseShrinkListen() {
    if (!collapseShrinkHandler) return;
    collapseEl.removeEventListener("transitionend", collapseShrinkHandler);
    collapseShrinkHandler = null;
  }

  function scheduleShrinkRailAfterClose() {
    cancelCollapseShrinkListen();
    var fallbackMs = 550;
    function done() {
      cancelCollapseShrinkListen();
      setRootWidthMode("mini");
    }
    collapseShrinkHandler = function (e) {
      if (e.target !== collapseEl) return;
      if (
        e.propertyName !== "grid-template-columns" &&
        e.propertyName !== "grid-template-rows"
      ) {
        return;
      }
      done();
    };
    collapseEl.addEventListener("transitionend", collapseShrinkHandler);
    setTimeout(function () {
      if (collapseShrinkHandler) done();
    }, fallbackMs);
  }

  function headerAria() {
    var narrow = false;
    try {
      narrow = window.matchMedia("(max-width: 480px)").matches;
    } catch (_) {}
    var railLbl = narrow
      ? String(cfg.title || "Скидка").trim()
      : ((cfg.title || "") + " " + (cfg.kicker || "")).trim();
    if (expanded) {
      header.setAttribute("aria-label", "Свернуть: " + railLbl);
    } else {
      header.setAttribute(
        "aria-label",
        "Открыть промокод: " + (railLbl || "Скидка")
      );
    }
  }

  function commitOpen() {
    if (openSource !== "hover") return;
    openSource = "click";
    if (cfg.rememberState && expanded) persistExpanded(true);
  }

  function applyExpanded(v, source) {
    var on = !!v;
    var wasExpanded = expanded;
    expanded = on;
    clearHoverReveal();
    if (!on) {
      openSource = "closed";
      cancelCollapseShrinkListen();
      panel.setAttribute("data-expanded", "false");
      header.setAttribute("aria-expanded", "false");
      persistExpanded(false);
      headerAria();
      if (wasExpanded) {
        scheduleShrinkRailAfterClose();
      } else {
        setRootWidthMode("mini");
      }
      return;
    }

    cancelCollapseShrinkListen();
    setRootWidthMode("full");

    openSource = source || "click";
    panel.setAttribute("data-expanded", "true");
    header.setAttribute("aria-expanded", "true");
    if (openSource === "click" || openSource === "storage") {
      persistExpanded(true);
    }
    headerAria();
  }

  /** Закрытие крестиком: скрыть сейчас; на следующих страницах показ снова после dismissCooldownMs. */
  function dismissWidgetFully() {
    clearDemo();
    cancelCollapseShrinkListen();
    persistDismissTimestamp();
    applyExpanded(false);
    root.setAttribute("hidden", "");
    root.setAttribute("data-ready", "false");
  }

  function toggle() {
    clearDemo();
    if (expanded) {
      applyExpanded(false);
    } else {
      applyExpanded(true, "click");
    }
  }

  function onPanelMouseEnter() {
    pointerInPanel = true;
    if (cfg.hoverOpen === false) return;
    if (!useRailBehavior()) {
      if (!expanded) applyExpanded(true, "hover");
      return;
    }
    if (expanded) return;

    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
      setRootWidthMode("full");
      applyExpanded(true, "hover");
      return;
    }

    clearHoverReveal();
    setRootWidthMode("full");

    var manualMs = cfg.hoverRevealBodyMs;
    if (typeof manualMs === "number" && manualMs >= 0) {
      hoverRevealTimer = setTimeout(function () {
        hoverRevealTimer = null;
        tryOpenHoverBody();
      }, manualMs);
      return;
    }

    hoverRevealFallbackTimer = setTimeout(function () {
      hoverRevealFallbackTimer = null;
      root.removeEventListener("transitionend", onRailWidthTransitionEnd);
      tryOpenHoverBody();
    }, 550);

    root.addEventListener("transitionend", onRailWidthTransitionEnd);
  }

  function onPanelMouseLeave() {
    pointerInPanel = false;
    clearHoverReveal();
    if (expanded && openSource === "hover") {
      applyExpanded(false);
      return;
    }
    if (!expanded && supportsHoverFine()) {
      cancelCollapseShrinkListen();
      setRootWidthMode("mini");
    }
  }

  var stored = getStoredExpanded();
  var initial = stored !== null ? stored : cfg.startExpanded !== false;
  cancelCollapseShrinkListen();
  if (initial) {
    applyExpanded(true, "storage");
  } else {
    applyExpanded(false);
  }

  header.addEventListener("click", toggle);
  header.addEventListener("keydown", function (e) {
    if (e.key === "Enter" || e.key === " ") {
      e.preventDefault();
      toggle();
    }
  });

  /* На ≤768px у .coupon-root pointer-events: none — hover вешаем на панель */
  panel.addEventListener("mouseenter", onPanelMouseEnter);
  panel.addEventListener("mouseleave", onPanelMouseLeave);

  panel.addEventListener("click", function (e) {
    if (header === e.target || header.contains(e.target)) return;
    clearDemo();
    commitOpen();
  });

  panel.addEventListener("focusin", function (e) {
    if (header.contains(e.target)) return;
    clearDemo();
    commitOpen();
  });

  codeEl.addEventListener("click", function (e) {
    e.stopPropagation();
    commitOpen();
    copyCode(true);
  });
  codeEl.addEventListener("keydown", function (e) {
    if (e.key === "Enter" || e.key === " ") {
      e.preventDefault();
      e.stopPropagation();
      commitOpen();
      copyCode(true);
    }
  });

  if (closeFullEl) {
    closeFullEl.addEventListener("click", function (e) {
      e.stopPropagation();
      dismissWidgetFully();
    });
    closeFullEl.addEventListener("keydown", function (e) {
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        e.stopPropagation();
        dismissWidgetFully();
      }
    });
  }

  document.addEventListener("keydown", function (e) {
    if (e.key !== "Escape" || !expanded) return;
    if (!isNarrowMobile()) return;
    e.preventDefault();
    dismissWidgetFully();
  });

  function scheduleAutoDemo() {
    if (cfg.autoDemo === false) return;
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    if (expanded) return;
    if (stored === true) return;

    var onceKey = storageKey + ":auto-demo-shown";
    if (cfg.autoDemoOncePerSession !== false) {
      try {
        if (sessionStorage.getItem(onceKey)) return;
      } catch (_) {}
    }

    var after =
      typeof cfg.autoDemoAfterMs === "number" ? cfg.autoDemoAfterMs : 900;
    var hold =
      typeof cfg.autoDemoHoldMs === "number" ? cfg.autoDemoHoldMs : 3000;

    demoTimers.push(
      setTimeout(function () {
        if (expanded) return;
        function openDemoBody() {
          if (expanded) return;
          applyExpanded(true, "demo");
          demoTimers.push(
            setTimeout(function () {
              applyExpanded(false);
              try {
                if (cfg.autoDemoOncePerSession !== false) {
                  sessionStorage.setItem(onceKey, "1");
                }
              } catch (_) {}
            }, hold)
          );
        }
        if (useRailBehavior()) {
          setRootWidthMode("full");
          var railWait =
            typeof cfg.hoverRailExpandMs === "number"
              ? cfg.hoverRailExpandMs
              : 400;
          demoTimers.push(setTimeout(openDemoBody, railWait));
        } else {
          openDemoBody();
        }
      }, after)
    );
  }

  var delay =
    (typeof cfg.showDelayMs === "number" ? cfg.showDelayMs : 0) +
    dismissCooldownRemainingMs();

  function finishShow() {
    root.setAttribute("data-ready", "true");
    scheduleAutoDemo();
  }

  function revealWhenLaidOut() {
    function go() {
      requestAnimationFrame(function () {
        requestAnimationFrame(finishShow);
      });
    }
    if (delay > 0) {
      setTimeout(go, delay);
    } else {
      go();
    }
  }

  revealWhenLaidOut();
}

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", runCouponWidget);
  } else {
    runCouponWidget();
  }
})();

    </script>
    <script src="local-test/coupon-test-reset.js"></script>
  </body>
</html>
